[project]
name = "wxpower"
version = "0.1.0"
description = "Day-ahead wind and solar generation forecasts for Germany from ICON weather forecasts, compared with the TSO forecast"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "requests>=2.31",
    "pyarrow>=15",
    "tabulate>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
